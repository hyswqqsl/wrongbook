<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI错题本 · 数学</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<script defer src="/static/vendor/katex/katex.min.js"></script>
<script defer src="/static/vendor/katex/auto-render.min.js"></script>
<style>
:root{--ink:#1a1a2e;--sub:#666;--line:#e3e6ee;--blue:#2456d6;--bg:#f5f7fb;--red:#d64045;--green:#2e9e5b;--amber:#c77c0a}
*{box-sizing:border-box} body{margin:0;font:15px/1.65 "PingFang SC","Songti SC",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:18px;align-items:center;position:sticky;top:0;z-index:9}
header h1{font-size:18px;margin:0 26px 0 0}
nav button{border:0;background:none;font-size:15px;padding:8px 14px;cursor:pointer;border-radius:8px;color:var(--sub)}
nav button.on{background:var(--blue);color:#fff}
main{max-width:1180px;margin:18px auto;padding:0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
button.pri{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 18px;font-size:14px;cursor:pointer}
button.sec{background:#fff;color:var(--blue);border:1px solid var(--blue);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer}
button.warn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer}
button:disabled{opacity:.45;cursor:wait}
#overlay{position:fixed;inset:0;background:rgba(20,25,40,.55);z-index:99;display:flex;align-items:center;justify-content:center}
.ov-box{background:#fff;border-radius:14px;padding:26px 44px;text-align:center;font-size:15px;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:0 auto 12px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#result-banner{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;background:#e9f9ef;border:2px solid var(--green);border-radius:12px;padding:12px 22px;box-shadow:0 6px 30px rgba(0,0,0,.2);max-width:760px;font-size:14.5px}
#result-banner h3{margin:0 0 4px;font-size:17px;color:var(--green)}
.commitbar{position:sticky;top:52px;z-index:8;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.commitbar span{color:var(--sub)}.commitbar b{color:var(--ink)}
.commitbar button{margin-left:auto}
input[type=file],input[type=text],input[type=date],select{font:inherit}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;margin-right:6px;vertical-align:1px}
.t-easy{background:#e6f4ea;color:#1e7e43}.t-med{background:#fff4e0;color:#9a6700}.t-hard{background:#fdeaea;color:#b3261e}
.t-conflict{background:#fdeaea;color:#b3261e}.t-pass{background:#e6f4ea;color:#1e7e43}.t-review{background:#eee;color:#555}.t-kp{background:#e8f0fe;color:#1a56db}
.bignum{display:flex;gap:26px;margin-bottom:8px}
.bignum div{text-align:center}.bignum b{display:block;font-size:34px}
.bignum span{color:var(--sub);font-size:13px}
.bars{margin:6px 0 14px}
.bar-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.bar-row label{width:110px;color:var(--sub);text-align:right;flex:none}
.bar-track{flex:1;background:#eef1f7;border-radius:5px;height:16px;position:relative}
.bar-fill{height:100%;border-radius:5px;background:var(--blue)}
.bar-row span{width:36px;font-size:12px;color:var(--sub)}
table.tb{border-collapse:collapse;width:100%;font-size:13.5px}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.tb th{color:var(--sub);font-weight:500}
.badge{background:var(--amber);color:#fff;font-size:11px;border-radius:5px;padding:1px 7px;margin-left:6px}
/* 录入：拖拽/粘贴/点选 三入口待传区 */
#drop-area{margin-top:10px;border:2px dashed var(--line);border-radius:10px;min-height:96px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,background .15s}
#drop-area:hover{border-color:#b9c6e8}
#drop-area.drag{border-color:var(--blue);background:#eef3ff}
#thumbs{display:flex;gap:10px;flex-wrap:wrap;padding:12px}
.thumb{position:relative;width:92px}
.thumb img{width:92px;height:66px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:#f2f4f8}
.thumb .rm{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1}
.thumb .nm{font-size:11px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hidden{display:none!important}   /* !important：压过 #overlay/#qmodal 等 ID 选择器的 display（V1.0.3d 误删致遮罩常显，已恢复） */
/* 排版机人审 */
.figsvg{text-align:center}.figsvg svg{max-width:360px;height:auto}
.review{display:grid;grid-template-columns:1fr 1.2fr;gap:14px}
.photo-wrap{position:relative;user-select:none}
.photo-wrap img{width:100%;display:block;border:1px solid var(--line);border-radius:8px}
.photo-wrap.picking{cursor:crosshair}
.photo-wrap.picking img{opacity:.75}
.selbox{position:absolute;border:2px solid var(--blue);background:rgba(36,86,214,.14);pointer-events:none;border-radius:2px}
.figops{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.figsrc{font-size:12.5px;color:var(--sub);margin-right:auto}
.figops button{font-size:13px;padding:5px 11px}
.figbusy{font-size:12.5px;color:var(--amber)}
.qcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#fff}
.qcard.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.qcard textarea{width:100%;min-height:74px;font:13px/1.6 ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:6px}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.qhead b{font-size:14px}
.choices div{color:#333;padding-left:18px}
.answer-line{color:var(--sub);font-size:13px;margin-top:4px}
.reason-row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:13.5px}
.reason-row input[type=text]{border:1px solid var(--line);border-radius:6px;padding:4px 8px;flex:1;min-width:120px}
.report{background:#f6f8fc;border-radius:8px;padding:10px 14px;font-size:13px;font-family:ui-monospace,monospace;white-space:pre-wrap}
/* 刷题 */
.quiz figure{margin:8px 0;text-align:center}
.quiz figure svg{max-width:420px;height:auto}
.quiz .ans{background:#f2fbf5;border:1px solid #cdecd8;border-radius:8px;padding:10px 14px;margin-top:10px}
.katex{font-size:1.02em}
.small{font-size:12.5px;color:var(--sub)}
/* 题目详情弹窗 */
#qmodal{position:fixed;inset:0;background:rgba(20,25,40,.55);z-index:90;display:flex;align-items:center;justify-content:center}
.qm-box{background:#fff;border-radius:14px;padding:0 26px 20px;width:min(780px,94vw);max-height:88vh;overflow:auto;box-shadow:0 10px 50px rgba(0,0,0,.3)}
/* AI 引擎设置弹窗 */
#aimodal{position:fixed;inset:0;background:rgba(20,25,40,.55);z-index:95;display:flex;align-items:center;justify-content:center}
/* 图片放大查看器（v1.1.0g）：点击题卡/详情图形 → 全屏看大图，点任意处/Esc 关闭 */
#imgview{position:fixed;inset:0;background:rgba(10,12,20,.85);z-index:97;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#imgview img{max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 10px 60px rgba(0,0,0,.5)}
.zoomimg{cursor:zoom-in}
.ai-box{background:#fff;border-radius:14px;padding:0 26px 20px;width:min(600px,94vw);max-height:88vh;overflow:auto;box-shadow:0 10px 50px rgba(0,0,0,.3)}
/* 🧠 GeoGebra 重画弹窗（v1.1a） */
#gmodal{position:fixed;inset:0;background:rgba(20,25,40,.55);z-index:96;display:flex;align-items:center;justify-content:center}
.ggb-box{background:#fff;border-radius:14px;padding:14px 18px;width:fit-content;max-width:96vw;max-height:92vh;overflow:auto;box-shadow:0 10px 50px rgba(0,0,0,.3)}
.ggb-main{display:flex;gap:14px;margin-top:10px;align-items:stretch}
.ggb-question{border:1px solid var(--line);background:#f7f8fc;border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13.5px;line-height:1.6;max-height:120px;overflow:auto;max-width:880px;overflow-wrap:anywhere}   /* 限宽：长题干换行，不撑大 fit-content 弹窗（v1.1.0g）*/
.ggb-side{width:360px;display:flex;flex-direction:column;gap:6px}
.ggb-side textarea{flex:1;min-height:0;width:100%;box-sizing:border-box;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;padding:6px;border:1px solid var(--line);border-radius:6px;resize:none}
.ggb-btns{display:flex;gap:6px;width:100%}
.ggb-btns .sec{flex:1;white-space:nowrap;padding:6px 2px;font-size:12.5px;text-align:center}
.ggb-log{min-height:44px;max-height:120px;overflow:auto;background:#f7f7fa;border:1px solid var(--line);border-radius:6px;padding:6px 8px;line-height:1.5;overflow-wrap:anywhere}
.ai-box h3{margin:0;font-size:17px}
.ai-prov{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.ai-prov.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.ai-prov input[type=password],.ai-prov input[type=text]{width:100%;font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 9px;margin-top:6px}
.ai-krow{display:flex;gap:8px;margin-top:6px;font-size:13px;align-items:center}
.qm-head{position:sticky;top:0;z-index:5;background:#fff;margin:0 -26px 10px;padding:20px 26px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.qm-meta{margin-top:12px}
.qm-head b{font-size:16px}
.qm-head button:first-of-type{margin-left:auto}   /* 首个按钮（删除）推向右侧；后续按钮（关闭）紧邻 */
.qm-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.qm-sec{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:14px}
.qm-prac{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.8}
/* 年级/知识点归类 */
.cls-row{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13.5px;flex-wrap:wrap}
.cls-row select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit}
details.kptree{position:relative}
details.kptree summary{cursor:pointer;list-style:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;color:var(--blue);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.kptree[open] summary{color:var(--ink)}
.kptree-body{position:absolute;z-index:30;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);max-height:320px;overflow:auto;min-width:340px;padding:6px;margin-top:4px}
.kp-ch>summary,.kp-sec>summary{cursor:pointer;padding:3px 6px;font-size:13.5px;border-radius:5px}
.kp-ch>summary:hover,.kp-sec>summary:hover{background:#eef3ff}
.kp-item{padding:3px 10px 3px 20px;font-size:13px;cursor:pointer;border-radius:5px}
.kp-item:hover{background:#eef3ff}
.kp-item.on{background:var(--blue);color:#fff}
/* 专题（V1.2） */
.tp-set{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;background:#fdfdff}
.tp-set:hover{box-shadow:0 0 0 1px var(--blue);cursor:pointer}
.tp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.tp-cat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.tp-cat:hover{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.tp-ana-wrap{margin-top:6px}
/* 做题（试卷式）选项 */
.pq-opt{display:block;padding:4px 8px;border-radius:6px;cursor:pointer}
.pq-opt:hover{background:#eef3ff}
.print-head{display:none}
@page{margin:1.6cm}
@media print{
  header,#overlay,#qmodal,#aimodal,#gmodal,#dash-filter,.no-print{display:none!important}
  body{background:#fff}
  main{max-width:none;margin:0;padding:0}
  .card{border:none;box-shadow:none;padding:0;margin:0 0 12px}
  .print-head{display:block;text-align:center;margin-bottom:18px}
  .print-head h2{margin:0 0 6px;font-size:20px}
  .print-head .pline{font-size:14px;color:#333}
  .pq{break-inside:avoid;margin-bottom:22px;padding:0;border:none}
  .pq-res,.pq-res *{display:none!important}
  .pq-fill,.pq-short{border:none!important;border-bottom:1px solid #444!important;border-radius:0!important}
  .pq-opt,.choices div{padding:2px 0}
  .qtext{font-size:14px}
}
</style>
</head>
<body>
<header>
  <h1>📐 AI错题本</h1>
  <nav>
    <button data-tab="ingest" class="on">录入题目</button>
    <button data-tab="dash">工作台</button>
    <button data-tab="topics">专题</button>
  </nav>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <span class="small">用户</span>
    <select id="user-sel" onchange="switchUser(this.value)" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px;font:inherit"></select>
    <button class="sec" style="font-size:13px;padding:5px 10px" onclick="addUser()">＋ 新用户</button>
    <button class="sec" id="ai-badge" style="font-size:13px;padding:5px 10px" onclick="openAiConfig()" title="AI 引擎与 API Key 设置">⚙ 设置</button>
  </div>
</header>
<main>

<!-- ========== Tab1 录入（双入口：录入错题本 / 录入专题，入口由菜单决定） ========== -->
<section id="tab-ingest">
  <div class="card">
    <b id="upload-title">上传错题照片</b>　<span id="upload-hint" class="small">一张或多张试卷/练习册照片；转录后逐题勾选入库并标注错因，可同时勾选存入专题</span>
    <div id="drop-area" title="点击选择文件；也可拖拽或粘贴">
      <div id="drop-hint" style="text-align:center;padding:18px 12px">
        <div style="font-size:32px;line-height:1.2">🖼️</div>
        <div style="margin-top:4px"><b>拖拽图片到这里，或按 <span style="color:var(--blue)">Ctrl/⌘+V</span> 直接粘贴</b></div>
        <div class="small">微信/QQ/网页里复制的图片、截图都可以直接粘贴；也可点击此区域选择文件（支持多张）</div>
      </div>
      <div id="thumbs" class="hidden"></div>
    </div>
    <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="sec" onclick="pickFiles()">📁 选择文件</button>
      <button class="sec" onclick="pasteFromClipboard()">📋 从剪贴板粘贴</button>
      <input type="file" id="photos" accept="image/*" multiple class="hidden">
      <input type="text" id="src-note" placeholder="来源（可选，如：期中卷/课本P53）" style="flex:1;min-width:180px;padding:6px 10px;border:1px solid var(--line);border-radius:6px">
      <button class="pri" id="btn-upload">转录</button>
    </div>
    <div id="upload-status" class="small" style="margin-top:8px"></div>
  </div>
  <div id="review-area"></div>
</section>

<!-- ========== Tab2 工作台 ========== -->
<section id="tab-dash" class="hidden"></section>

<!-- ========== Tab 专题（V1.2：专题集 → 类别 → 典型例题 + 练习） ========== -->
<section id="tab-topics" class="hidden"><div id="topics-area" class="card">加载中…</div></section>

<!-- ========== 做题与批改（不入菜单：工作台勾选→开始做题 进入） ========== -->
<section id="tab-quiz" class="hidden">
  <div class="card" id="quiz-box">加载中…</div>
</section>

</main>
<div id="overlay" class="hidden"><div class="ov-box"><div class="spinner"></div><div id="ov-text">处理中…</div></div></div>
<div id="qmodal" class="hidden"></div>
<div id="aimodal" class="hidden"></div>
<div id="gmodal" class="hidden"></div>
<div id="imgview" class="hidden" onclick="this.classList.add('hidden')"><img id="imgview-img" alt=""></div>
<div id="result-banner" class="hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tex(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}
$$('nav button').forEach(b=>b.onclick=()=>{
  if(paperData&&!confirm('正在做题，是否退出？'))return;   // 做题中防误触（批改完成/放弃后不再拦）
  $$('nav button').forEach(x=>x.classList.toggle('on',x===b));
  const sec=b.dataset.tab;   // ingest|dash|topics（专题录入入口在专题页各类别内）
  if(sec==='ingest')setIngestMode('book');
  ['ingest','dash','quiz','topics'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==sec));
  if(sec==='dash')loadDash();
  if(sec==='topics')loadTopics();
});

/* ---------- Tab1 录入（排版机）—— 双入口：录入错题本 / 录入专题 ---------- */
let sheets=[];
let INGEST_MODE='book';   // 'book'=录入错题本（主） | 'topic'=录入专题（主，从专题页各类别进入）；另一侧为附加勾选
let TP_INGEST_CAT=null;   // {set,cat} 从专题页进入时锁定的目标类别（转录后自动勾选存入该类）
function tpLockLabel(){
  if(!TP_INGEST_CAT)return '';
  for(const s of (TOPICS&&TOPICS.sets||[]))for(const c of s.categories)
    if(s.id===TP_INGEST_CAT.set&&c.id===TP_INGEST_CAT.cat)return `${s.name} · 第${c.no}类 ${c.name}`;
  return '';
}
function setIngestMode(m,lockCat){
  INGEST_MODE=m;
  TP_INGEST_CAT=(m==='topic'&&lockCat)?{...lockCat}:null;
  const t=$('#upload-title'),h=$('#upload-hint');
  if(t)t.textContent=m==='book'?'上传错题照片':'上传专题例题照片'+(TP_INGEST_CAT?`（存入 ${tpLockLabel()}）`:'');
  if(h)h.textContent=m==='book'
    ?'一张或多张试卷/练习册照片；转录后逐题勾选入库并标注错因'
    :'一张或多张照片；转录后自动勾选存入目标专题类别，知识点由大模型分析';
  renderReview();   // 无条件渲染：锁定条/空状态提示立即出现，不等转录
}
function tpLockChange(val){   // 锁定条上更换目标类别：已自动勾选的题同步换类
  const i=val.indexOf(':');
  TP_INGEST_CAT={set:val.slice(0,i),cat:val.slice(i+1)};
  sheets.filter(s=>(s.mode||'book')==='topic').forEach(s=>s.questions.forEach(q=>{
    if(q.dest_topic){q.dest_topic={...TP_INGEST_CAT};q.tp_sel={...TP_INGEST_CAT};}
  }));
  const t=$('#upload-title');
  if(t)t.textContent='上传专题例题照片（存入 '+tpLockLabel()+'）';
  const st=$('#upload-status');
  if(st)st.textContent='';   // 锁定状态只在人审区 amber 条展示（避免重复）
  renderReview();
}
function tpLockExit(){   // 退出锁定（保留已勾选状态，手动管理）
  TP_INGEST_CAT=null;
  renderReview();
}
function tpIngest(sid,cid){   // 专题页各类别的录入入口：切录入 tab + 锁定目标类别
  setIngestMode('topic',{set:sid,cat:cid});
  $$('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='ingest'));

/* 带超时的 fetch（v1.2）：慢请求永不无限转圈；超时 abort → catch 显示明确错误 */
function fetchT(url,opt={},ms=120000){

async function pasteFromClipboard(){   // 按钮主动读剪贴板（Chrome/Edge/Safari 支持；失败则提示按键粘贴）

function videoBlockHtml(v){
  if(!v)return '';
  v=String(v);
  if(/^https?:\/\//i.test(v)){
    let t='',pg='';
    try{const n=new URL(v);t=(n.searchParams.get('t')||'').replace(/^\D+|\D+$/g,'');pg=n.searchParams.get('p')||'';}catch(e){}
    const bv=v.match(/bilibili\.com\/video\/(BV[0-9A-Za-z]+)/);
    const av=v.match(/bilibili\.com\/video\/av(\d+)/i);
    if(bv||av){
      const q=new URLSearchParams();
      if(bv)q.set('bvid',bv[1]);else q.set('aid',av[1]);
      if(t)q.set('t',t);
      q.set('page',pg||'1');q.set('autoplay','0');q.set('danmaku','0');q.set('high_quality','1');
      return `<iframe src="https://player.bilibili.com/player.html?${q.toString()}" scrolling="no" frameborder="no" allowfullscreen style="width:100%;max-width:560px;height:315px;margin-top:6px;border-radius:8px;border:1px solid var(--line)"></iframe>`;
    }
    const yt=v.match(/(?:youtu\.be\/|[?&]v=)([\w-]{6,})/);
    if(yt)return `<iframe src="https://www.youtube-nocookie.com/embed/${yt[1]}${t?`?start=${t}`:''}" allowfullscreen style="width:100%;max-width:560px;height:315px;margin-top:6px;border-radius:8px;border:1px solid var(--line)"></iframe>`;
    return `<div style="margin-top:6px"><a href="${esc(v)}" target="_blank" rel="noopener">🔗 打开视频链接</a></div>`;
  }
  return `<video controls preload="metadata" src="/data/${v.replace(/^.*data\//,'')}" style="width:100%;max-width:560px;margin-top:6px;border-radius:8px"></video>`;
}

    pw.classList.remove('picking');
    const sid2=pickState.sid, no=pickState.no;

    document.removeEventListener('keydown',pickEsc);
    if(box[2]-box[0]<0.02||box[3]-box[1]<0.02){alert('框选区域太小，请重试');return;}
    await figBusy(sid2,no,true,'抓取中…');
    try{
      const j=await (await fetch(`/api/sheets/${sid2}/questions/${no}/recrop`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({box})})).json();
      if(j.error){alert('❌ '+j.error); await figBusy(sid2,no,false); return;}
      const s=sheets.find(v=>v.id===sid2), q=s.questions.find(v=>v.no===no);
      q.figure_crops=j.figure_crops; q.figure_spec=null; q.figure_svg=null; q.figure_mode='crop';

      renderReview(); flash(sid2,no,'✅ 已按框选抓取原图形');
    }catch(err){alert('❌ '+err); await figBusy(sid2,no,false);}
  };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);

/* 全局提交：一次处置所有选题（存错题本走质量链；存专题零 LLM），锁屏 → 完成横幅汇总 */
async function commitAll(btn){
  const hasDest=q=>q.selected||q.dest_topic;
  const visible=sheets.filter(s=>(s.mode||'book')===INGEST_MODE);   // 只提交当前入口的照片（双入口独立）
  const jobs=visible.filter(s=>s.questions.some(hasDest));
  if(!jobs.length)return alert('先勾选错题本 或 选择「存入专题」目标');
  const noReason=jobs.flatMap(s=>s.questions.filter(q=>q.selected&&(!q.reason||!q.reason.kind)));
  if(noReason.length&&!confirm(`有 ${noReason.length} 题未标错因（存错题本需要），确定继续？`))return;
  showOv('录入中…（存错题本需走质量链：LLM 验伪+分析，约 0.5~2 分钟/题；仅存专题秒过）');
  const agg={ingested:[],skipped:[],topics:[],errors:[]};
  const applyResults=(sheet,j)=>{
    (j.results||[]).forEach(x=>{
      const q=sheet.questions.find(v=>v.no===x.no);
      if(q&&x.topic_id){q.dest_topic_done=true;agg.topics.push(x.no);}
      if(x.skipped_manual){if(q){q.done='skip';q.selected=false;q.skip=false;q.dest_topic=null;}}
      else if(x.skipped){agg.skipped.push(`第${x.no}题 与已入库题 ${x.duplicate_of} 重复，未重复录入`);
        if(q){q.done='dup'; q.selected=false;}}
      else if(x.id){agg.ingested.push({no:x.no,id:x.id,report:x.report||[]});
        if(q){q.done=q.dest_topic_done?'both':'ingested'; q.selected=false;}}
      else if(x.topic_id&&q){q.done='topic'; q.selected=false;}
    });
  };
  try{
    for(let i=0;i<jobs.length;i++){
      // v1.2r 异步提交：POST 立即返回，轮询进度（HTTP 不再长挂，无超时问题）
      const t0=Date.now();
      try{
        const r=await fetchT(`/api/sheets/${jobs[i].id}/commit`,{method:'POST'},30000); const j=await r.json();
        if(j.error){agg.errors.push(j.error);continue;}
        // 轮询：每 1.5s 拉一次进度；单张兜底上限 20 分钟（服务重启丢 job 时给出友好提示）
        while(true){
          await new Promise(res=>setTimeout(res,1500));
          const sj=await (await fetch(`/api/commit-status/${jobs[i].id}`)).json();
          const secs=Math.round((Date.now()-t0)/1000);
          if(sj.state==='done'||sj.state==='error'){
            if(sj.state==='error')agg.errors.push('录入失败：'+(sj.error||'未知错误'));
            else applyResults(jobs[i],sj);
            break;
          }
          if(sj.state==='idle'){   // 服务重启导致 job 丢失
            if(secs>15){agg.errors.push('服务已重启，本张录入中断——请稍后到「工作台」确认结果后重新勾选提交');break;}
            continue;             // 刚提交瞬间可能尚未注册，继续等
          }
          setOv(`录入中… 第 ${i+1}/${jobs.length} 张照片 · 当前第${sj.cur_no??'?'}题（错题本 ${agg.ingested.length+sj.ingested} · 专题 ${agg.topics.length+sj.topics} · 跳过重复 ${agg.skipped.length+sj.skipped}）· 已用时 ${secs}s ——请勿关闭页面`);
          if(secs>1200){agg.errors.push('等待超 20 分钟已停止轮询——后台可能仍在处理，稍后到「工作台」查看结果');break;}
        }
        // 照片不整体结束：未处理的题保持可勾选，可再次提交（v0.6.3）
      }catch(e){
        agg.errors.push(String(e));
      }
    }
  }finally{hideOv();}
  // 不隐藏题目列表：保留显示直到下次点「转录」再清空
  renderReview(); loadTopics();   // 刷新专题数据（新增例题同步到专题 Tab 与下拉）
  $('#upload-status').textContent='✅ 已入库 '+agg.ingested.length+' 题'+
    (agg.topics.length?`，存入专题 ${agg.topics.length} 题`:'')+
    (agg.skipped.length?`，跳过重复 ${agg.skipped.length} 题`:'')+
    (agg.errors.length?`，失败 ${agg.errors.length} 张`:'');
  showResult(agg);
}
function showResult(a){
  const el=$('#result-banner');
  let html=`<h3>✅ 录入完成</h3><div>入库 <b>${a.ingested.length}</b> 题`+
    (a.topics.length?` · 存入专题 <b>${a.topics.length}</b> 题（第${a.topics.join('、')}题）`:'')+
    (a.skipped.length?` · 跳过重复 <b>${a.skipped.length}</b> 题`:'')+
    (a.errors.length?` · 失败 ${a.errors.length} 张`:'')+'</div>';

  html+=`<div style="margin-top:8px;text-align:right"><button class="sec" onclick="document.getElementById('result-banner').classList.add('hidden')">知道了</button></div>`;
  el.innerHTML=html; el.classList.remove('hidden');
}

/* Set* 样式命令在 web 版 evalCommand 里不执行（实测 geometry/classic 均 false）→
   翻译为 Apps API 同名直调方法（v1.1.0b 实证：setLineStyle/setColor 视觉生效） */
const GGB_SET_API={
  SetLineStyle:(g,o,v)=>{g.setLineStyle(o,parseInt(v));return true;},   // API 方法返回 void：不异常即成功（实测 XML 生效）
  SetPointSize:(g,o,v)=>{const n=parseInt(v);if(n===0){g.setVisible(o,false);return true;}   // 尺寸最小 1：设 0 的本意是隐藏（实测 val="0" 被忽略）→ 翻译为 setVisible
    g.setPointSize(o,n);return true;},
  SetLineThickness:(g,o,v)=>{g.setLineThickness(o,parseInt(v));return true;},
  SetVisible:(g,o,v)=>{g.setVisible(o,/true/i.test(v));return true;},
  ShowLabel:(g,o,v)=>{g.setLabelVisible(o,/true/i.test(v));return true;},   // ⚠ 非 Set 开头：正则必须查表匹配而非前缀匹配（v1.1.0c 踩坑）
  SetLabelMode:(g,o,v)=>{g.setLabelMode(o,parseInt(v));return true;},
  SetCaption:(g,o,v)=>{g.setCaption(o,String(v).replace(/^['"]|['"]$/g,''));return true;},
  SetColor:(g,o,v)=>{const c=String(v).replace(/['"]/g,'').trim();
    const hx=/^#([0-9a-fA-F]{6})$/.exec(c);
    const named={red:[255,0,0],green:[0,128,0],blue:[0,0,255],black:[0,0,0],gray:[128,128,128],orange:[255,165,0],purple:[160,32,240]};
    const rgb=hx?[parseInt(hx[1].slice(0,2),16),parseInt(hx[1].slice(2,4),16),parseInt(hx[1].slice(4,6),16)]:(named[c.toLowerCase()]||null);
    if(!rgb)return false;   // 无法解析的颜色名 → 按失败报告（不影响图形本体）
    g.setColor(o,rgb[0],rgb[1],rgb[2]);return true;},
  ZoomIn:(g,o,v)=>{const p=v.split(',').map(x=>parseFloat(x));   // ZoomIn(minx,miny,maxx,maxy) → setCoordSystem(xmin,xmax,ymin,ymax)
    if(p.length!==4||p.some(isNaN))return false;
    g.setCoordSystem(p[0],p[2],p[1],p[3]);return true;},
};
function applyGgbLine(ln){
  const m=/^(\w+)\s*\(\s*([^,]+?)\s*,\s*(.+)\)$/.exec(ln);
  if(m&&GGB_SET_API[m[1]]){   // 查表匹配（不要只认 Set 前缀：ShowLabel 这类也在表里）
    const o=m[2].replace(/^['"]|['"]$/g,'');
    try{return !!GGB_SET_API[m[1]](window.ggbApplet,o,m[3]);}catch(e){return false;}
  }
  return window.ggbApplet.evalCommand(ln);   // 非 Set* 命令走原路
}
function ggbRun(){
  const txt=$('#ggb-cmds').value.trim();if(!txt)return;
  const lines=txt.split('\n').map(x=>x.trim()).filter(Boolean);
  const fails=[];
  window.ggbApplet.reset();
  lines.forEach((ln,i)=>{try{if(!applyGgbLine(ln))fails.push('第'+(i+1)+'行: '+ln);}catch(e){fails.push('第'+(i+1)+'行: '+ln+' ('+e+')');}});
  if(fails.length){
    ggbState.lastFails=fails;
    ggbLog('❌ '+fails.length+' 行执行失败（<b>不自动重试</b>，省 token）：<br>'+esc(fails.join('；'))+
      '<br>可手改命令后点「▶️ 执行命令」；或点下方「🩺 分析解决」把脚本和报错发给 AI；或「🤖 生成命令」重新草稿。');
    const fx=document.getElementById('ggb-fixrow'); if(fx)fx.classList.remove('hidden');   // 只有报错了才出现
  }else{
    ggbState.lastFails=null;
    const fx=document.getElementById('ggb-fixrow'); if(fx)fx.classList.add('hidden');
    ggbLog('✅ 构造成功（'+lines.length+' 行）。可拖动自由点修正画法，满意后点「✅ 导出并保存」。');
  }
}
async function ggbFix(){
  if(!ggbState||!ggbState.lastFails||!ggbState.lastFails.length)return;
  showOv('🩺 正在分析修复脚本（把脚本和报错发给 AI）…');   // 全局遮罩：修复期间锁操作
  try{

    +'📝 请回到「工作台」勾选题目，点 <b>开始做题</b> 进入本页批改练习<br>'
    +'<span class="small" style="margin-top:6px;display:inline-block">（本页不再提供随机刷题入口）</span>'
    +'<div style="margin-top:14px"><button class="sec" onclick="goDash()">← 去工作台</button></div></div>';
}
/* ---------- 自动评分 ---------- */
function extractKeys(x){return [...new Set(String(x||'').toUpperCase().match(/[A-D]/g)||[])].sort().join('');}
function normAns(x){
  let t=String(x||'').toLowerCase().replace(/\s+/g,'')
    .replace(/[,,。;;::!！??()（）]/g,'');
  t=t.replace(/(cm|mm|dm|m|°|%)$/,'');   // 去常见单位尾
  return t;
}
function gradeFill(my,ans){
  const a=normAns(my),b=normAns(ans);
  if(a&&a===b)return true;
  const na=parseFloat(a),nb=parseFloat(b);
  if(!isNaN(na)&&!isNaN(nb))return Math.abs(na-nb)<1e-6;   // 数值等价（3=3.0）
  return false;
}
/* ---------- 做题（试卷式）：勾选题目一次列出，作答后统一批改 ---------- */

      <span style="margin-left:auto;display:flex;gap:10px">
        <button class="pri" onclick="submitPaper()">✅ 完成并批改</button>
        <button class="sec" onclick="quitPaper()">放弃</button></span></div>
    <div class="print-head">
      <h2>${esc(title||'数学错题练习卷')}</h2>
      <div class="pline">共 ${qs.length} 题 · 班级＿＿＿＿　姓名＿＿＿＿　日期＿＿＿＿</div>
    </div>
    <div id="paper-summary"></div>
    ${body}
    <div class="no-print" style="margin:10px 0"><button class="pri" onclick="submitPaper()">✅ 完成并批改</button></div>`;
  tex($('#quiz-box'));
  window.scrollTo(0,0);
}
function gradeShort(my,ans){
  const a=normAns(my),b=normAns(ans);
  if(!a)return false;
  if(a===b)return true;
  const na=parseFloat(a),nb=parseFloat(b);
  if(!isNaN(na)&&!isNaN(nb))return Math.abs(na-nb)<1e-6;
  return b.includes(a)||a.includes(b);   // 要点包含即算对
}
async function submitPaper(){
  if(!paperData)return;
  const divs=[...document.querySelectorAll('#quiz-box .pq')];
  divs.forEach(div=>div.querySelectorAll('input,textarea,button').forEach(el=>el.disabled=true));
  let ok=0; const wrongKps={};
  for(const div of divs){
    const i=+div.dataset.i, q=paperData[i];
    const an=q.analysis||{};
    const ans=q.verified_answer||'', type=q.type;
    let my='', correct=false;
    if(type==='single'){const r=div.querySelector('input:checked');my=r?r.value:'';
      correct=my!==''&&extractKeys(my)===extractKeys(ans);}
    else if(type==='multiple'){my=[...div.querySelectorAll('input:checked')].map(x=>x.value).sort().join('');
      correct=my!==''&&extractKeys(my)===extractKeys(ans);}
    else if(type==='fill'){my=div.querySelector('.pq-fill')?div.querySelector('.pq-fill').value:'';
      correct=gradeFill(my,ans);}
    else{my=div.querySelector('.pq-short')?div.querySelector('.pq-short').value:'';
      correct=gradeShort(my,ans);}
    const wrongBefore=(q.practice||[]).filter(p=>!p.correct).length;
    const r=await (await fetch(q.__topic?`/api/topics/examples/${q.id}/practice`:`/api/questions/${q.id}/practice`,
      {method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({correct})})).json();
    if(correct)ok++;
    if(!correct)((an.kp_path||[]).slice(2,3).concat(an.knowledge_points||[])).forEach(k=>{if(k)wrongKps[k]=(wrongKps[k]||0)+1;});
    const stk=r.streak||0;
    const badges=[
      r.ready?`<span class="badge">${q.__topic?'🏆 已掌握（连对3次）':'✅ 建议归档'}</span>`:`<span class="small">连对 ${stk}/3</span>`,
      (!correct&&wrongBefore>=1)?'<span class="tag t-conflict">⚠ 重复做错</span>':'',
      my===''?'<span class="tag t-review">未作答</span>':`<span class="small">你的答案：${esc(my)}</span>`].join(' ');
    div.querySelector('.pq-res').innerHTML=`
      <div class="ans" style="border-color:${correct?'#cdecd8':'#f0c9cb'};background:${correct?'#f2fbf5':'#fdf1f1'}">
        <b>${correct?'✅ 正确':'❌ 错误'}</b>　正确答案：<b>${esc(ans)||'（无）'}</b>
        <div style="margin-top:4px">状态：${badges}</div>
        <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">
          ${r.ready&&!q.__topic?`<button class="pri" onclick="masterQ('${q.id}')">📦 归档</button>`:''}
        </div></div>`;
  }
  const n=divs.length, score=n?Math.round(ok/n*100):0;
  let comment;
  if(score>=90)comment='🎉 优秀！本组题目掌握扎实。';
  else if(score>=75)comment='👍 良好。巩固错题后很快都能建议归档。';
  else if(score>=60)comment='💪 及格。建议近期重做本组错题巩固。';
  else comment='📚 需要加强，以下知识点错得较多：';
  const kpChips=Object.entries(wrongKps).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`<span class="tag t-conflict">${esc(k)} ×${v}</span>`).join(' ');
  document.getElementById('paper-summary').innerHTML=`
    <div class="card" style="border:2px solid var(--blue)">
      <b>批改结果</b>　得分 <b style="font-size:26px">${score}</b> 分（答对 ${ok}/${n}）
      <div style="margin-top:6px">${comment} ${kpChips||'（全部正确 🎉）'}</div>
      <div class="small" style="margin-top:4px">每题作答已计入练习记录（连对次数/建议归档状态见各题）</div>
    </div>`;
  paperData=null;
  window.scrollTo(0,0);
}

  try{
    const r=await fetchT(`/api/topics/examples/${eid}/analyze`,{method:'POST'});
    const j=await r.json();
    if(j.error)return alert('❌ '+j.error);
    tpReload();
  }catch(e){alert('❌ 分析失败：'+e);if(btn){btn.disabled=false;btn.textContent='🤖 AI 分析（思路 / 易错点 / 知识点）';}}
}
function tpPracticeOne(sid,cid,eid){
  const set=TOPICS.sets.find(s=>s.id===sid),cat=set.categories.find(c=>c.id===cid);
  tpEnterPaper([cat.examples.find(e=>e.id===eid)],set,cat);
}
function tpPracticeCat(sid,cid){
  const set=TOPICS.sets.find(s=>s.id===sid),cat=set.categories.find(c=>c.id===cid);
  tpEnterPaper(cat.examples,set,cat);
}
function tpEnterPaper(exs,set,cat){   // 专题例题 → 做题页（复用批改/连对/掌握）
  if(paperData&&!confirm('正在做题，是否退出？'))return;
  const items=exs.map(e=>({__topic:true,id:e.id,type:e.type,verified_answer:e.answer,
    question:{text:e.text,choices:e.choices,figure_crop:e.figure_crop,figure_spec:e.figure_spec},
    figure_svg:e.figure_svg,
    analysis:{difficulty:{easy:1,medium:2,final:3}[cat.difficulty]||2,
              chapter:`${set.name}·${cat.name}`,knowledge_points:[]}}));
  $$('nav button').forEach(x=>x.classList.remove('on'));
  ['ingest','dash','topics'].forEach(t=>$('#tab-'+t).classList.add('hidden'));
  $('#tab-quiz').classList.remove('hidden');
  renderPaper(items,`${set.name} · 第${cat.no}类${cat.name}`);
  window.scrollTo(0,0);
}

/* ---------- AI 引擎设置（注入式 key：仅存服务端 data/ai_config.json，前端只见掩码） ---------- */
let AI_CFG=null, AI_SEL=null;
async function loadAiConfig(){
  try{
    AI_CFG=await (await fetch('/api/ai-config')).json();
    updateAiBadge();
    if(!AI_CFG.ready&&!sessionStorage.getItem('ai-cfg-opened')){   // 首次使用：自动弹设置
      sessionStorage.setItem('ai-cfg-opened','1');
      openAiConfig('首次使用请先配置 AI 引擎：任选一家，填入你的 API Key（仅存本机，不上传）');
    }
  }catch(e){}
}
function updateAiBadge(){
  const b=$('#ai-badge'); if(!b||!AI_CFG)return;
  if(AI_CFG.ready){b.textContent='⚙ '+AI_CFG.providers[AI_CFG.provider].label;b.style.color='';b.style.borderColor='';}
  else{b.textContent='⚙ 设置 · 未配置引擎';b.style.color='var(--amber)';b.style.borderColor='var(--amber)';}
}
function openAiConfig(notice){
  if(!AI_CFG)return;
  AI_SEL=AI_CFG.provider||'deepseek';
  $('#aimodal').classList.remove('hidden');
  renderAiModal(notice);
}
function closeAiConfig(){$('#aimodal').classList.add('hidden');}
function aiPick(pid,e){   // 整卡片可点选中；输入框/按钮/链接不重渲染（防丢已输内容）
  if(['INPUT','BUTTON','A','TEXTAREA','SELECT','LABEL'].includes(e.target.tagName))return;
  AI_SEL=pid;renderAiModal();
}
function renderAiModal(notice){
  const P=AI_CFG.providers;
  $('#aimodal').innerHTML=`<div class="ai-box">
    <div class="qm-head"><h3>⚙ AI 引擎设置</h3><button class="sec" onclick="closeAiConfig()">关闭</button></div>
    ${notice?`<div class="small" style="margin:12px 0 6px">${esc(notice)}</div>`:''}
    ${Object.entries(P).map(([pid,p])=>`
      <div class="ai-prov ${AI_SEL===pid?'on':''}" onclick="aiPick('${pid}',event)">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <b>${esc(p.label)}</b>
          ${p.has_key?`<span class="tag t-pass">已配置 ${esc(p.key_masked)}（${p.key_source==='env'?'环境变量':'本机配置'}）</span>`
                     :`<span class="tag t-review">未配置</span>`}
          ${AI_CFG.provider===pid?'<span class="tag t-easy">当前使用</span>':''}
          <a href="${p.apply_url}" target="_blank" class="small" style="margin-left:auto" onclick="event.stopPropagation()">申请 Key ↗</a>
        </div>
        <div class="small">${esc(p.note)}</div>
        ${AI_SEL===pid?`
          <input type="password" id="ai-key-${pid}" autocomplete="off"
                 placeholder="${p.has_key?'留空 = 不修改已存 Key':'粘贴 API Key（环境变量名 '+esc(p.key_env)+'）'}">
          <div class="ai-krow"><span style="width:64px;color:var(--sub)">文本模型</span>
            <input type="text" id="ai-tm-${pid}" value="${esc(p.text_model)}" placeholder="${esc(p.default_text_model)}"></div>
          <div class="ai-krow"><span style="width:64px;color:var(--sub)">视觉模型</span>
            <input type="text" id="ai-vm-${pid}" value="${esc(p.vision_model)}" placeholder="${esc(p.default_vision_model)}"></div>
          <div class="ai-krow"><span class="small">转录/图形向量化走视觉模型</span>
            <button class="sec" style="margin-left:auto" onclick="event.stopPropagation();testAiConfig('${pid}')">测试连接</button></div>
          <div id="ai-test-${pid}" class="small" style="margin-top:4px;white-space:pre-wrap"></div>`:''}
      </div>`).join('')}
    <div style="display:flex;gap:10px;margin-top:12px;align-items:center">
      <span class="small">Key 仅保存在服务端本机 data/ai_config.json，不会随代码发布或上传</span>
      <button class="pri" style="margin-left:auto" onclick="saveAiConfig()">保存</button>
    </div>
  </div>`;
}
async function testAiConfig(pid){   // 文本+视觉各一次最小真实调用；测试值不落盘
  const box=$('#ai-test-'+pid); if(!box)return;
  const key=($('#ai-key-'+pid).value||'').trim(), tm=($('#ai-tm-'+pid).value||'').trim(), vm=($('#ai-vm-'+pid).value||'').trim();
  box.textContent='测试中…（文本 + 视觉各一次最小调用，约 2~5 秒）';
  const post=b=>fetch('/api/ai-config/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
  const r1=await post({provider:pid,key:key||null,model:tm||null});
  const r2=await post({provider:pid,key:key||null,model:vm||null,vision:true});
  box.innerHTML=(r1.ok?'✅ 文本模型 '+esc(r1.model):'❌ 文本：'+esc(r1.error))+'<br>'
               +(r2.ok?'✅ 视觉模型 '+esc(r2.model):'❌ 视觉：'+esc(r2.error));
}
async function saveAiConfig(){
  const pid=AI_SEL, keys={}, models={};
  const k=$('#ai-key-'+pid); if(k&&k.value.trim())keys[pid]=k.value.trim();   // 留空=不改
  models[pid]={text:($('#ai-tm-'+pid).value||'').trim(),vision:($('#ai-vm-'+pid).value||'').trim()};
  const j=await (await fetch('/api/ai-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:pid,keys,models})})).json();
  if(j.error)return alert('❌ '+j.error);
  AI_CFG=j;updateAiBadge();closeAiConfig();
}
$('#aimodal').onclick=e=>{   // 仅「关闭/保存」按钮可关；点遮罩不关（防误触丢未保存的 key）
  if(e.target.id==='aimodal'){/* 刻意无操作 */}
};

/* ---------- 用户切换（v0.7：按用户隔离题库/草稿单/照片） ---------- */
async function loadUsers(){
  try{
    const j=await (await fetch('/api/users')).json();
    $('#user-sel').innerHTML=j.users.map(u=>`<option value="${u.id}" ${u.id===j.current?'selected':''}>${esc(u.name)}</option>`).join('');
  }catch(e){}
}
async function switchUser(uid){
  if(!confirm('切换用户？当前页面未提交的内容将丢弃。')){loadUsers();return;}
  await fetch('/api/users/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:uid})});
  sessionStorage.setItem('after-switch','dash');   // 重载后直达工作台
  history.replaceState(null,'',location.pathname); // 去掉 #quiz 残留 hash（直接改 href 同路径会被当片段导航不重载）
  location.reload();
}
async function addUser(){
  const name=prompt('新用户名称（如：孩子B）：'); if(!name)return;
  const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  const j=await r.json();
  if(j.error)return alert('❌ '+j.error);
  location.reload();   // 新用户题库为空，已自动切换
}
loadUsers();
loadAiConfig();
loadTopics();   // 专题数据预载（录入页「专题分类」与「同时存入专题」下拉都需要）
if(sessionStorage.getItem('after-switch')==='dash'){   // 切换用户后：直达工作台（V1.0.3e）
  sessionStorage.removeItem('after-switch');
  document.querySelector('nav button[data-tab=dash]').click();   // click 内含 loadDash
}else{
  loadDash();   // 默认着陆仍预载工作台数据
}
function enterQuizView(){   // 做题视图：菜单全部未选中，切到做题区
  $$('nav button').forEach(x=>x.classList.remove('on'));
  ['ingest','dash'].forEach(t=>$('#tab-'+t).classList.add('hidden'));
  $('#tab-quiz').classList.remove('hidden');
  loadQuiz();
}
if(location.hash==='#quiz'){enterQuizView();}   // 工作台「开始做题」新标签页直达
window.addEventListener('hashchange',()=>{if(location.hash==='#quiz')enterQuizView();});   // 同页改 hash 兑底
</script>
